{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">

<head>
    <meta charset="utf-8">
    <title>Ro'yxatdan o'tish — Test Bor Baza</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="testborbaza ro'yxatdan o'tish, akkaunt yaratish" name="keywords">
    <meta content="TestBorBaza platformasidan ro'yxatdan o'ting va intellektual testlar ekotizimiga qo'shiling." name="description">

    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP & ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">

    <!-- SCRIPT FOR PREVENTING THEME FLASH -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <style>
        /* DYNAMIC THEMES (TUN / KUN) */
        :root, [data-bs-theme="dark"] {
            --bg-canvas: #090D16;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --brand-primary: #00E6C0;
            --brand-glow: rgba(0, 230, 192, 0.35);
            --brand-hover: #00B395;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.12);
            --btn-google-bg: rgba(255, 255, 255, 0.06);
            --btn-google-hover: rgba(255, 255, 255, 0.12);
            --nav-toggle-bg: rgba(255, 255, 255, 0.08);
            --blob-opacity: 0.35;
        }

        [data-bs-theme="light"] {
            --bg-canvas: #F4FBF7;
            --card-bg: #FFFFFF;
            --card-border: #E2E8F0;
            --brand-primary: #008675;
            --brand-glow: rgba(0, 134, 117, 0.2);
            --brand-hover: #007063;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --input-bg: #F8FAFC;
            --input-border: #CBD5E1;
            --btn-google-bg: #F1F5F9;
            --btn-google-hover: #E2E8F0;
            --nav-toggle-bg: #E2E8F0;
            --blob-opacity: 0.15;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden !important;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* DYNAMIC MESH BACKGROUND */
        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: var(--blob-opacity);
            animation: floatBlob 18s infinite alternate ease-in-out;
            transition: opacity 0.3s ease;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #00CBA9 0%, rgba(0,0,0,0) 70%);
            animation-duration: 14s;
        }

        .blob-2 {
            bottom: -15%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6366F1 0%, rgba(0,0,0,0) 70%);
            animation-duration: 20s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.1); }
            100% { transform: translate(-30px, 40px) scale(0.95); }
        }

        /* HEADER / NAV */
        .auth-header-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 0;
            z-index: 10;
        }

        .brand-text {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            color: var(--text-main) !important;
            text-decoration: none !important;
            letter-spacing: -0.5px;
            font-size: 1.15rem;
        }

        .brand-color-icon {
            color: var(--brand-primary);
            filter: drop-shadow(0 0 6px var(--brand-glow));
        }

        .brand-color-text {
            color: var(--brand-primary);
        }

        /* THEME TOGGLE BUTTON */
        .theme-toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: var(--nav-toggle-bg);
            border: 1px solid var(--card-border);
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 1.1rem;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.05);
            color: var(--text-main);
        }

        /* CENTERED CONTAINER */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 85px 16px 25px 16px;
            position: relative;
            z-index: 2;
        }

        /* COMPACT GLASS CARD */
        .register-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 420px; /* Ixchamroq o'lcham */
            width: 100%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .register-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .register-header h3 {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .register-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* GOOGLE SSO BUTTON */
        .btn-google {
            background: var(--btn-google-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 10px;
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-google:hover {
            background: var(--btn-google-hover);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .divider-line {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 16px 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider-line::before, .divider-line::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }

        .divider-line span {
            padding: 0 10px;
        }

        /* FORM CONTROLS */
        .form-label {
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .input-group-custom {
            position: relative;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px var(--brand-glow);
            color: var(--text-main);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .pwd-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 5;
            font-size: 1rem;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .pwd-toggle-btn:hover {
            color: var(--brand-primary);
        }

        /* SUBMIT BUTTON */
        .btn-register {
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-hover) 100%);
            color: #FFFFFF !important;
            border: none;
            border-radius: 10px;
            padding: 11px;
            font-weight: 700;
            font-size: 0.95rem;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 8px 20px var(--brand-glow);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        [data-bs-theme="dark"] .btn-register {
            color: #090D16 !important;
        }

        .btn-register:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 25px var(--brand-glow);
            opacity: 0.95;
        }

        .footer-text {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .invalid-feedback {
            display: block;
            font-size: 0.78rem;
            margin-top: 3px;
            color: #FF5252;
            font-weight: 500;
        }

        /* FULL MOBILE ADAPTIVITY (COMPACT TO LARGE SCREENS) */
        @media (max-width: 576px) {
            main {
                padding: 75px 12px 20px 12px;
            }

            .register-card {
                padding: 22px 18px;
                border-radius: 16px;
            }

            .register-header h3 {
                font-size: 1.3rem;
            }

            .register-header p {
                font-size: 0.8rem;
            }

            .form-control {
                padding: 9px 12px;
                font-size: 0.88rem;
            }

            .btn-google {
                padding: 9px;
                font-size: 0.85rem;
            }

            .btn-register {
                padding: 10px;
                font-size: 0.9rem;
            }
        }

        /* VERY SMALL MOBILE SCREENS (320px - 360px) */
        @media (max-width: 360px) {
            .register-card {
                padding: 18px 14px;
            }

            .row.g-2 > div {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- MESH BACKGROUND -->
    <div class="mesh-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="auth-header-nav">
        <div class="container px-3 d-flex align-items-center justify-content-between">
            <a href="/" class="brand-text d-flex align-items-center">
                <i class="bi bi-journal-check me-2 brand-color-icon"></i>testborbaza<span class="brand-color-text">.uz</span>
            </a>

            <!-- KUN / TUN REJIM TUGMASI -->
            <button class="theme-toggle-btn" id="theme-toggle" title="Rejimni o'zgartirish">
                <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CENTERED CONTENT -->
    <main>
        <div class="register-card">
            
            <div class="register-header">
                <h3>Ro'yxatdan o'tish</h3>
                <p>Platformaga qo'shiling va testlarni boshlang</p>
            </div>

            <!-- GOOGLE OAUTH BUTTON -->
            <a href="{% provider_login_url 'google' %}" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
                    <path fill="#FBBC05" d="M5.6 13.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/>
                    <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                </svg>
                <span>Google orqali kirish</span>
            </a>

            <div class="divider-line">
                <span>Yoki email orqali</span>
            </div>

            <form id="registerForm" method="POST">
                {% csrf_token %}
                
                <div class="row g-2">
                    <div class="col-6 mb-2">
                        <label for="id_first_name" class="form-label">Ism</label>
                        <input type="text" id="id_first_name" class="form-control" placeholder="Ismingiz" required>
                        <div class="invalid-feedback" id="error_first_name"></div>
                    </div>

                    <div class="col-6 mb-2">
                        <label for="id_last_name" class="form-label">Familiya</label>
                        <input type="text" id="id_last_name" class="form-control" placeholder="Familiyangiz" required>
                        <div class="invalid-feedback" id="error_last_name"></div>
                    </div>
                </div>

                <div class="mb-2">
                    <label for="id_email" class="form-label">Email manzilingiz</label>
                    <input type="email" id="id_email" class="form-control" placeholder="example@gmail.com" required>
                    <div class="invalid-feedback" id="error_email"></div>
                </div>

                <div class="mb-3">
                    <label for="id_password" class="form-label">Maxfiy parol</label>
                    <div class="input-group-custom">
                        <input type="password" id="id_password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="pwd-toggle-btn" id="togglePassword" title="Parolni ko'rsatish">
                            <i class="bi bi-eye-slash-fill" id="pwdIcon"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="error_password"></div>
                </div>

                <button type="submit" class="btn btn-register">
                    <span>Ro'yxatdan o'tish</span>
                    <i class="bi bi-arrow-right-short fs-5"></i>
                </button>
            </form>

            <p class="footer-text">
                Allaqachon ro'yxatdan o'tganmisiz? <a href="{% url 'login' %}">Tizimga kirish</a>
            </p>
        </div>
    </main>

    <!-- JS SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- DYNAMIC DARK/LIGHT THEME SYNCHRONIZATION ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        // Sync with localStorage across pages (home, register, etc.)
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        updateIcon(savedTheme);

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                let currentTheme = htmlElement.getAttribute('data-bs-theme');
                let newTheme = (currentTheme === 'light') ? 'dark' : 'light';
                htmlElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateIcon(newTheme);
            });
        }

        function updateIcon(theme) {
            if (themeIcon) {
                themeIcon.className = (theme === 'dark') ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
            }
        }

        // --- PASSWORD VISIBILITY TOGGLE ---
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('id_password');
        const pwdIcon = document.getElementById('pwdIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            pwdIcon.className = type === 'password' ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
        });

        // --- CSRF TOKEN COOKIE HELPER ---
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // --- AJAX REGISTER FORM SUBMISSION ---
        document.getElementById('registerForm').addEventListener('submit', async function(e){
            e.preventDefault();

            ['first_name','last_name','email','password'].forEach(f=>{
                const errField = document.getElementById(`error_${f}`);
                const inputField = document.getElementById(`id_${f}`);
                if(errField) errField.innerText = '';
                if(inputField) inputField.classList.remove('is-invalid');
            });

            const data = {
                username: document.getElementById('id_email').value.trim(),
                email: document.getElementById('id_email').value.trim(),
                first_name: document.getElementById('id_first_name').value.trim(),
                last_name: document.getElementById('id_last_name').value.trim(),
                password: document.getElementById('id_password').value.trim()
            };

            try {
                const response = await fetch('/api/users/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify(data)
                });

                if(response.ok){
                    alert("Ro'yxatdan o'tish muvaffaqiyatli. Endi tizimga kirishingiz mumkin.");
                    window.location.href = "{% url 'login' %}";
                } else if(response.status === 400){
                    const errors = await response.json();
                    for(const key in errors){
                        const fieldKey = (key === 'username') ? 'email' : key;
                        const errField = document.getElementById(`error_${fieldKey}`);
                        const inputField = document.getElementById(`id_${fieldKey}`);
                        if(errField && inputField){
                            errField.innerText = Array.isArray(errors[key]) ? errors[key].join(', ') : errors[key];
                            inputField.classList.add('is-invalid');
                        }
                    }
                } else {
                    alert("Serverda noma'lum xatolik yuz berdi.");
                }
            } catch(err){
                alert("Server bilan bog'lanishda muammo.");
                console.error(err);
            }
        });
    </script>
</body>
</html>
