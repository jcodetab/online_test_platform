{% load static %}
<!DOCTYPE html>
<html lang="uz" class="scroll-smooth">

<head>
    <meta charset="utf-8">
    <title>Ro'yxatdan o'tish — Test Bor Baza</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="testborbaza ro'yxatdan o'tish, akkaunt yaratish" name="keywords">
    <meta content="TestBorBaza platformasidan ro'yxatdan o'ting va intellektual testlar ekotizimiga qo'shiling." name="description">

    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP & ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #090D16;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --brand-primary: #00E6C0;
            --brand-glow: rgba(0, 230, 192, 0.4);
            --brand-hover: #00B395;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.12);
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden !important;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        /* 2026 DYNAMIC ANIMATED MESH BACKGROUND */
        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: floatBlob 18s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #00CBA9 0%, rgba(0,0,0,0) 70%);
            animation-duration: 14s;
        }

        .blob-2 {
            bottom: -15%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #6366F1 0%, rgba(0,0,0,0) 70%);
            animation-duration: 20s;
        }

        .blob-3 {
            top: 40%;
            left: 35%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #00E6C0 0%, rgba(0,0,0,0) 70%);
            animation-duration: 16s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.15); }
            100% { transform: translate(-40px, 50px) scale(0.95); }
        }

        /* HEADER */
        .auth-header-nav {
            position: absolute;
            top: 24px;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .brand-text {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            color: var(--text-main) !important;
            text-decoration: none !important;
            letter-spacing: -0.5px;
        }

        .brand-color-icon {
            color: var(--brand-primary);
            filter: drop-shadow(0 0 8px var(--brand-glow));
        }

        .brand-color-text {
            color: var(--brand-primary);
        }

        /* GLASS CARD WITH ENTRANCE ANIMATION */
        .register-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 36px;
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 2;
            margin: auto;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .register-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .register-header h3 {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .register-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* GOOGLE SSO BUTTON */
        .btn-google {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .divider-line {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .divider-line::before, .divider-line::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }

        .divider-line span {
            padding: 0 12px;
        }

        /* FORM CONTROLS */
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .input-group-custom {
            position: relative;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(0, 230, 192, 0.15);
            color: var(--text-main);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .pwd-toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 5;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }

        .pwd-toggle-btn:hover {
            color: var(--brand-primary);
        }

        /* ANIMATED SUBMIT BUTTON */
        .btn-register {
            background: linear-gradient(135deg, var(--brand-primary) 0%, #00B395 100%);
            color: #090D16 !important;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            margin-top: 12px;
            box-shadow: 0 10px 25px var(--brand-glow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 230, 192, 0.5);
            background: linear-gradient(135deg, #00FFD5 0%, #00CBA9 100%);
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .footer-text a:hover {
            color: #00FFD5;
            text-decoration: underline;
        }

        .invalid-feedback {
            display: block;
            font-size: 0.8rem;
            margin-top: 4px;
            color: #FF5252;
            font-weight: 500;
        }

        @media (max-width: 576px) {
            .register-card {
                padding: 28px 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ANIMATED MESH BACKGROUND -->
    <div class="mesh-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="auth-header-nav">
        <div class="container px-3 px-lg-4 d-flex align-items-center justify-content-between">
            <a href="/" class="brand-text d-flex align-items-center fs-5">
                <i class="bi bi-journal-check me-2 brand-color-icon"></i>testborbaza<span class="brand-color-text">.uz</span>
            </a>
        </div>
    </header>

    <!-- MAIN REGISTER FORM CARD -->
    <main class="w-100 d-flex align-items-center justify-content-center py-5 my-auto">
        <div class="register-card">
            
            <div class="register-header">
                <h3>Ro'yxatdan o'tish</h3>
                <p>Platformaga qo'shiling va testlarni boshlang</p>
            </div>

            <!-- GOOGLE OAUTH BUTTON -->
            <a href="/accounts/google/login/" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
                    <path fill="#FBBC05" d="M5.6 13.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/>
                    <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                </svg>
                <span>Google orqali kirish</span>
            </a>

            <div class="divider-line">
                <span>Yoki email orqali</span>
            </div>

            <form id="registerForm" method="POST">
                {% csrf_token %}
                
                <div class="row g-2">
                    <div class="col-md-6 mb-3">
                        <label for="id_first_name" class="form-label">Ism</label>
                        <input type="text" id="id_first_name" class="form-control" placeholder="Ismingiz" required>
                        <div class="invalid-feedback" id="error_first_name"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="id_last_name" class="form-label">Familiya</label>
                        <input type="text" id="id_last_name" class="form-control" placeholder="Familiyangiz" required>
                        <div class="invalid-feedback" id="error_last_name"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="id_email" class="form-label">Email manzilingiz</label>
                    <input type="email" id="id_email" class="form-control" placeholder="example@gmail.com" required>
                    <div class="invalid-feedback" id="error_email"></div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label">Maxfiy parol</label>
                    <div class="input-group-custom">
                        <input type="password" id="id_password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="pwd-toggle-btn" id="togglePassword" title="Parolni ko'rsatish">
                            <i class="bi bi-eye-slash-fill" id="pwdIcon"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="error_password"></div>
                </div>

                <button type="submit" class="btn btn-register">
                    <span>Ro'yxatdan o'tish</span>
                    <i class="bi bi-arrow-right-short fs-5"></i>
                </button>
            </form>

            <p class="footer-text">
                Allaqachon ro'yxatdan o me'yordami? <a href="{% url 'login' %}">Tizimga kirish</a>
            </p>
        </div>
    </main>

    <!-- JS SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- PASSWORD VISIBILITY TOGGLE ---
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('id_password');
        const pwdIcon = document.getElementById('pwdIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            pwdIcon.className = type === 'password' ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
        });

        // --- CSRF TOKEN COOKIE HELPER ---
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        // --- AJAX REGISTER FORM SUBMISSION ---
        document.getElementById('registerForm').addEventListener('submit', async function(e){
            e.preventDefault();

            ['first_name','last_name','email','password'].forEach(f=>{
                const errField = document.getElementById(`error_${f}`);
                const inputField = document.getElementById(`id_${f}`);
                if(errField) errField.innerText = '';
                if(inputField) inputField.classList.remove('is-invalid');
            });

            const data = {
                username: document.getElementById('id_email').value.trim(),
                email: document.getElementById('id_email').value.trim(),
                first_name: document.getElementById('id_first_name').value.trim(),
                last_name: document.getElementById('id_last_name').value.trim(),
                password: document.getElementById('id_password').value.trim()
            };

            try {
                const response = await fetch('/api/users/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken
                    },
                    body: JSON.stringify(data)
                });

                if(response.ok){
                    alert("Ro'yxatdan o'tish muvaffaqiyatli. Endi tizimga kirishingiz mumkin.");
                    window.location.href = "{% url 'login' %}";
                } else if(response.status === 400){
                    const errors = await response.json();
                    for(const key in errors){
                        const fieldKey = (key === 'username') ? 'email' : key;
                        const errField = document.getElementById(`error_${fieldKey}`);
                        const inputField = document.getElementById(`id_${fieldKey}`);
                        if(errField && inputField){
                            errField.innerText = Array.isArray(errors[key]) ? errors[key].join(', ') : errors[key];
                            inputField.classList.add('is-invalid');
                        }
                    }
                } else {
                    alert("Serverda noma'lum xatolik yuz berdi.");
                }
            } catch(err){
                alert("Server bilan bog'lanishda muammo.");
                console.error(err);
            }
        });
    </script>
</body>
</html>
