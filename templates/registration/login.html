{% load static %}
<!DOCTYPE html>
<html lang="uz" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tizimga kirish — Test Bor Baza</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=500;600;700;800&family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <style>
    :root {
      --bg-light-core: #F8FAFC; 
      --brand-primary: #06BBCC; 
      --brand-hover: #0284C7;
      --text-main: #0F172A; 
      --text-muted: #64748B;
      --border-clean: rgba(255, 255, 255, 0.25);
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-light-core);
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Orqa fon rasmi va dinamik nur */
    .bg-container {
      background: url("{% static 'img/carousel-2.jpg' %}") center/cover no-repeat;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -2;
    }

    .bg-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(135deg, rgba(11, 19, 41, 0.75) 0%, rgba(15, 23, 42, 0.85) 100%);
      z-index: -1;
      backdrop-filter: blur(4px);
    }

    /* Login kartochka - Premium Glassmorphic style */
    .login-card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--border-clean);
      border-radius: 24px;
      padding: 42px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      animation: fadeInUp .6s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header i {
      font-size: 52px;
      color: var(--brand-primary);
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 4px 10px rgba(6, 187, 204, 0.3));
    }

    .login-header h3 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      color: var(--text-main);
      font-size: 1.75rem;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .login-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      border: 1.5px solid #E2E8F0;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.25s ease;
    }

    .form-control:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 4px rgba(6, 187, 204, 0.15);
      background: #FFFFFF;
    }

    .input-group {
      border-radius: 12px;
      overflow: hidden;
    }

    .input-group .form-control {
      border-top-right-radius: 0 !important;
      border-bottom-right-radius: 0 !important;
    }

    .input-group-text {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #E2E8F0;
      border-left: none;
      border-top-right-radius: 12px !important;
      border-bottom-right-radius: 12px !important;
      cursor: pointer;
      color: var(--text-muted);
      padding-left: 14px;
      padding-right: 14px;
      transition: all 0.25s ease;
    }

    .input-group-text:hover {
      color: var(--brand-primary);
      background: #FFFFFF;
    }

    .btn-login {
      background: linear-gradient(135deg, #06BBCC 0%, #0284C7 100%);
      border: none;
      border-radius: 50px;
      padding: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      box-shadow: 0 8px 20px rgba(6, 187, 204, 0.3);
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(6, 187, 204, 0.45);
      filter: brightness(1.05);
      color: #fff;
    }

    .footer-text {
      text-align: center;
      margin-top: 22px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--brand-primary);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-text a:hover {
      color: var(--brand-hover);
      text-decoration: underline;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== MOBILE ADAPTIVE STYLE ===== */
    @media (max-width: 480px) {
      body {
        padding: 15px !important;
      }

      .login-card {
        padding: 28px 20px !important;
        border-radius: 20px !important;
        max-width: 340px !important;
        background: rgba(255, 255, 255, 0.88) !important;
      }

      .login-header {
        margin-bottom: 18px !important;
      }

      .login-header i {
        font-size: 42px !important;
        margin-bottom: 6px !important;
      }

      .login-header h3 {
        font-size: 1.4rem !important;
      }

      .mb-3 {
        margin-bottom: 12px !important;
      }

      .form-control {
        height: 42px !important;
        font-size: 15px !important;
      }

      .btn-login {
        height: 46px !important;
        font-size: 0.95rem !important;
      }
    }
  </style>
</head>
<body>

  <!-- Orqa fon va overlay -->
  <div class="bg-container"></div>
  <div class="bg-overlay"></div>

  <!-- Login kartochka -->
  <div class="login-card">
    <div class="login-header">
      <i class="fa-solid fa-right-to-bracket"></i>
      <h3>Tizimga kirish</h3>
      <p>Akkountingizga kiring</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="id_email" class="form-label">Email manzilingiz</label>
        <input type="email" id="id_email" class="form-control" placeholder="nomi@gmail.com" required>
      </div>

      <div class="mb-3">
        <label for="id_password" class="form-label">Parol</label>
        <div class="input-group">
          <input type="password" id="id_password" class="form-control" placeholder="••••••••" required>
          <span class="input-group-text" id="togglePassword">
            <i class="bi bi-eye"></i>
          </span>
        </div>
      </div>

      <button type="submit" class="btn btn-login w-100">Kirish</button>
    </form>

    <p class="footer-text">
      Ro'yxatdan o'tmaganmisiz? <a href="{% url 'register' %}">Ro'yxatdan o'tish</a>
    </p>
  </div>

  <!-- JS LOYIHA MANTIQI -->
  <script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault(); // Djangoning standart form submitini to'xtatamiz

      // 1. Tozalash (Eski token va sessiyalarni o'chirish)
      localStorage.clear(); 

      const email = document.getElementById('id_email').value.trim();
      const password = document.getElementById('id_password').value.trim();

      try {
          const response = await fetch('/api/login/', {
              method: 'POST',
              headers: { 
                  'Content-Type': 'application/json',
                  'X-Requested-With': 'XMLHttpRequest' // Backendga bu AJAX so'rovi ekanini bildiradi
              },
              body: JSON.stringify({ email: email, password: password })
          });

          const data = await response.json();

          if (response.ok && data.token) {
              // 2. Tokenni saqlash
              localStorage.setItem("token", data.token);
              console.log("Token saqlandi:", data.token);

              // 3. Redirect mantiqi
              const targetUrl = window.location.origin + "/dashboard/";
              
              setTimeout(() => {
                  window.location.replace(targetUrl);
              }, 300); 

          } else {
              // Xatolik xabarini chiqarish
              const errorMsg = data.detail || data.non_field_errors || "Email yoki parol xato";
              alert(errorMsg);
          }
      } catch (error) {
          alert("Server bilan bog'lanishda muammo yuz berdi.");
          console.error("Login Error:", error);
      }
  });

  // Parolni ko‘rsatish/yashirish
  document.getElementById("togglePassword").addEventListener("click", function() {
      const passInput = document.getElementById("id_password");
      const type = passInput.getAttribute("type") === "password" ? "text" : "password";
      passInput.setAttribute("type", type);
      this.innerHTML = type === "password"
          ? '<i class="bi bi-eye"></i>'
          : '<i class="bi bi-eye-slash"></i>';
  });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
