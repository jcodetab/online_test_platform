{% load static %}
<!DOCTYPE html>
<html lang="uz" class="scroll-smooth" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <title>Tizimga kirish — Test Bor Baza</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="testborbaza login, tizimga kirish" name="keywords">
    <meta content="TestBorBaza platformasiga kiring va intellektual testlar hamda tahlillardan foydalaning." name="description">

    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- BOOTSTRAP & ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root, [data-bs-theme="light"] {
            --bg-hero: #F4FBF7; 
            --card-bg: #FFFFFF;
            --brand-primary: #00CBA9; 
            --brand-suit: #008675; 
            --brand-hover: #007063;
            --brand-light: rgba(0, 203, 169, 0.08);
            --text-main: #0F172A; 
            --text-muted: #475569;
            --border-clean: #E2E8F0;
            --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 20px 40px rgba(0, 134, 117, 0.15);
            --btn-radius: 10px;
        }

        [data-bs-theme="dark"] {
            --bg-hero: #0B1329; 
            --card-bg: #131C35;
            --brand-primary: #00E6C0; 
            --brand-suit: #10B981; 
            --brand-hover: #059669;
            --brand-light: rgba(0, 230, 192, 0.12);
            --text-main: #F8FAFC; 
            --text-muted: #94A3B8;
            --border-clean: #1E293B;
            --shadow-sm: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 20px 40px rgba(0, 0, 0, 0.5);
            --btn-radius: 10px;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden !important;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-hero);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px 15px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main) !important;
        }

        /* EMERALD AURA BACKGROUND EFFECT */
        .glow-aura-bg {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--brand-primary) 0%, rgba(0, 203, 169, 0.02) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(60px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        /* TOP NAVIGATION & BRAND HEADER */
        .auth-header-nav {
            position: absolute;
            top: 24px;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .brand-text {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main) !important;
            text-decoration: none !important;
        }

        .brand-color-icon {
            color: var(--brand-primary) !important;
            font-size: 1.4rem;
            filter: drop-shadow(0 0 5px rgba(0, 203, 169, 0.4));
        }

        .brand-color-text {
            color: var(--brand-primary) !important;
        }

        .theme-nav-toggle {
            width: 40px;
            height: 40px;
            border-radius: var(--btn-radius);
            background-color: var(--card-bg);
            border: 1px solid var(--border-clean);
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .theme-nav-toggle:hover {
            background-color: var(--brand-primary);
            color: #FFFFFF;
        }

        /* LOGIN CARD STYLING */
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-clean);
            border-radius: 20px;
            padding: 36px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 2;
            margin: auto;
            transition: all 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--brand-light);
            color: var(--brand-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
        }

        .login-header h3 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* FORM INPUT STYLES */
        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .input-group-custom {
            position: relative;
        }

        .form-control {
            background-color: var(--bg-hero);
            border: 1px solid var(--border-clean);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        .form-control:focus {
            background-color: var(--card-bg);
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px var(--brand-light);
            color: var(--text-main);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* PASSWORD TOGGLE EYE ICON */
        .pwd-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            z-index: 5;
            font-size: 1.1rem;
        }

        .pwd-toggle-btn:hover {
            color: var(--brand-primary);
        }

        .forgot-password-link {
            color: var(--brand-primary);
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-password-link:hover {
            color: var(--brand-suit);
            text-decoration: underline;
        }

        /* LOGIN BUTTON */
        .btn-login {
            background-color: var(--brand-suit) !important;
            color: #FFFFFF !important;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(0, 134, 117, 0.25);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background-color: var(--brand-hover) !important;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 134, 117, 0.35);
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-text a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .footer-text a:hover {
            color: var(--brand-suit);
            text-decoration: underline;
        }

        /* MAXIMUM COMPACT MOBILE STYLE */
        @media (max-width: 576px) {
            .auth-header-nav {
                top: 16px;
            }

            .login-card {
                padding: 24px 20px;
                border-radius: 16px;
                max-width: 100%;
            }

            .login-header {
                margin-bottom: 20px;
            }

            .login-icon-wrapper {
                width: 48px;
                height: 48px;
                font-size: 22px;
                margin-bottom: 8px;
            }

            .login-header h3 {
                font-size: 1.25rem;
            }

            .form-control {
                padding: 10px 14px;
                font-size: 0.9rem;
            }

            .btn-login {
                padding: 11px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <div class="glow-aura-bg"></div>

    <!-- HEADER / NAVIGATION -->
    <header class="auth-header-nav">
        <div class="container px-3 px-lg-4 d-flex align-items-center justify-content-between">
            <a href="/" class="brand-text d-flex align-items-center fs-5">
                <i class="bi bi-journal-check me-2 brand-color-icon"></i>testborbaza<span class="brand-color-text">.uz</span>
            </a>

            <button class="theme-nav-toggle" id="theme-toggle" title="Rejimni o'zgartirish">
                <i class="bi bi-sun-fill" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <!-- MAIN LOGIN FORM CARD -->
    <main class="w-100 d-flex align-items-center justify-content-center py-5 my-auto">
        <div class="login-card">
            
            <div class="login-header">
                <div class="login-icon-wrapper">
                    <i class="bi bi-box-arrow-in-right"></i>
                </div>
                <h3>Tizimga kirish</h3>
                <p>Platformadagi shaxsiy kabinetingizga kiring</p>
            </div>

            <form id="loginForm">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_email" class="form-label">Email manzilingiz</label>
                    <input type="email" id="id_email" class="form-control" placeholder="example@gmail.com" required>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="id_password" class="form-label mb-0">Maxfiy parol</label>
                        <a href="{% url 'password_reset' %}" class="forgot-password-link">Parolni unutdingizmi?</a>
                    </div>
                    <div class="input-group-custom">
                        <input type="password" id="id_password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="pwd-toggle-btn" id="togglePassword" title="Parolni ko'rsatish">
                            <i class="bi bi-eye-slash-fill" id="pwdIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-login">
                    <span>Tizimga kirish</span>
                    <i class="bi bi-arrow-right-short fs-5"></i>
                </button>
            </form>

            <p class="footer-text">
                Ro'yxatdan o'tmaganmisiz? <a href="{% url 'register' %}">Ro'yxatdan o'tish</a>
            </p>
        </div>
    </main>

    <!-- JS SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- DYNAMIC DARK/LIGHT THEME SWITCHER ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        updateIcon(currentTheme);

        themeToggleBtn.addEventListener('click', () => {
            let theme = htmlElement.getAttribute('data-bs-theme');
            theme = (theme === 'light') ? 'dark' : 'light';
            htmlElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            updateIcon(theme);
        });

        function updateIcon(theme) {
            themeIcon.className = (theme === 'dark') ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
        }

        // --- PASSWORD VISIBILITY TOGGLE ---
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('id_password');
        const pwdIcon = document.getElementById('pwdIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            pwdIcon.className = type === 'password' ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
        });

        // --- AJAX LOGIN FORM SUBMISSION ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            localStorage.clear();

            const email = document.getElementById('id_email').value.trim();
            const password = document.getElementById('id_password').value.trim();

            try {
                const response = await fetch('/api/login/', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem("token", data.token);

                    const targetUrl = window.location.origin + "/dashboard/";

                    setTimeout(() => {
                        window.location.replace(targetUrl);
                    }, 300); 

                } else {
                    const errorMsg = data.detail || data.non_field_errors || "Email yoki parol xato";
                    alert(errorMsg);
                }
            } catch (error) {
                alert("Server bilan bog'lanishda muammo yuz berdi.");
                console.error("Login Error:", error);
            }
        });
    </script>
</body>
</html>
